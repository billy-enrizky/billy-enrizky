<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=960, height=280" />
    <title>AI Engineering Focus</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url("assets/fonts/geist-latin-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 960px;
        height: 280px;
        margin: 0;
        overflow: hidden;
        background: #17191d;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #f3f1ec;
        background: #17191d;
        font-family: Geist, Arial, sans-serif;
      }

      .clip { position: absolute; inset: 0; }

      .topline {
        position: absolute;
        top: 23px;
        right: 36px;
        left: 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #b4b7ba;
        font-size: 12px;
        font-weight: 550;
        letter-spacing: 0.12em;
        line-height: 1;
        text-transform: uppercase;
      }

      .topline strong { color: #f3f1ec; font-weight: 650; }

      .top-rule {
        position: absolute;
        top: 50px;
        right: 36px;
        left: 36px;
        height: 1px;
        background: #3a3d40;
      }

      .zones {
        position: absolute;
        inset: 51px 36px 0;
        display: grid;
        grid-template-columns: 1fr 1.12fr 0.92fr;
      }

      .zone {
        position: relative;
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: space-between;
        padding: 25px 25px 23px;
      }

      .zone + .zone { border-left: 1px solid #3a3d40; }
      .zone:first-child { padding-left: 5px; }
      .zone:last-child { padding-right: 5px; }

      .zone-label {
        color: #f3f1ec;
        font-size: 16px;
        font-weight: 630;
        letter-spacing: 0.055em;
        line-height: 1.1;
        white-space: nowrap;
      }

      .zone-index {
        margin-right: 9px;
        color: #e77a58;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
      }

      .visual {
        position: relative;
        display: grid;
        height: 122px;
        place-items: center;
      }

      .inference-mark {
        position: relative;
        z-index: 1;
        width: 62px;
        height: 62px;
      }

      .inference-pulse {
        position: absolute;
        top: 17px;
        left: calc(50% - 44px);
        width: 88px;
        height: 88px;
        border: 1px solid #e77a58;
        border-radius: 50%;
        opacity: 0.22;
        animation: inference-pulse 1.8s ease-in-out 3 both;
      }

      .browser-stage { grid-template-columns: 115px 36px; column-gap: 5px; }

      .openbrowser-mark {
        width: 115px;
        height: 84px;
        object-fit: contain;
        animation: mark-breathe 2.7s cubic-bezier(0.45, 0, 0.55, 1) 2 both;
      }

      .browser-cursor {
        position: absolute;
        top: 65px;
        left: calc(50% + 18px);
        width: 20px;
        height: 26px;
        animation: cursor-move 2.7s cubic-bezier(0.45, 0, 0.55, 1) 2 both;
      }

      .research-stage { grid-template-columns: 72px 96px; column-gap: 13px; }
      .research-mark { width: 64px; height: 64px; }
      .research-plot { width: 96px; height: 60px; overflow: visible; }

      .research-line {
        fill: none;
        stroke: #5bb7b0;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: research-draw 2.7s cubic-bezier(0.45, 0, 0.55, 1) 2 both;
      }

      .zone-detail {
        color: #aeb2b6;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.09em;
        line-height: 1;
        text-transform: uppercase;
      }

      @keyframes inference-pulse {
        0%, 100% { opacity: 0.22; transform: scale(0.82); }
        50% { opacity: 0.7; transform: scale(1.12); }
      }

      @keyframes mark-breathe {
        0%, 100% { transform: scale(0.97); }
        50% { transform: scale(1.03); }
      }

      @keyframes cursor-move {
        0%, 100% { opacity: 0.5; transform: translate(0, 0); }
        50% { opacity: 1; transform: translate(15px, 10px); }
      }

      @keyframes research-draw {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 1; }
        50% { opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
      <div id="root" data-composition-id="profile-focus" data-no-timeline data-duration="6" data-width="960" data-height="280">
        <div class="topline"><strong>Applied AI, in practice</strong><span>Selected focus areas</span></div>
        <div class="top-rule" aria-hidden="true"></div>
        <div id="focus-layout" class="zones" aria-label="Three independent focus areas">
        <section class="zone" aria-label="Model inference">
          <div class="zone-label"><span class="zone-index">01</span>MODEL INFERENCE</div>
          <div class="visual">
            <span class="inference-pulse" aria-hidden="true"></span>
            <img class="inference-mark" src="assets/icons/inference.svg" alt="" />
          </div>
          <div class="zone-detail">vLLM · FP8 · MTP</div>
        </section>
        <section class="zone" aria-label="Browser tools">
          <div class="zone-label"><span class="zone-index">02</span>BROWSER TOOLS</div>
          <div class="visual browser-stage">
            <img class="openbrowser-mark" src="assets/openbrowser-mark.png" alt="" />
            <svg class="browser-cursor" viewBox="0 0 20 26" aria-hidden="true">
              <path d="M2 1.5v18l4.9-4.2 3.1 7 3-1.3-3.1-7.1 6.5-.2z" fill="#e77a58" stroke="#17191d" stroke-width="1.7" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="zone-detail">CDP · MCP · LOCAL TOOLS</div>
        </section>
        <section class="zone" aria-label="Applied research">
          <div class="zone-label"><span class="zone-index">03</span>APPLIED RESEARCH</div>
          <div class="visual research-stage">
            <img class="research-mark" src="assets/icons/research.svg" alt="" />
            <svg class="research-plot" viewBox="0 0 96 60" aria-hidden="true">
              <path class="research-line" pathLength="1" d="M5 51 L24 39 L42 42 L61 20 L82 25 L92 8" />
            </svg>
          </div>
          <div class="zone-detail">TRAINING · EVALUATION</div>
        </section>
        </div>
    </div>
  </body>
</html>
